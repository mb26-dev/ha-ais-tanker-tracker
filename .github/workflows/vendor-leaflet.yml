name: Vendor Leaflet

# Copies the unmodified Leaflet release (JS, CSS, images, license) from the
# npm registry into custom_components/ais_tanker/www/leaflet/ so the radar
# card never loads third-party code from a CDN at runtime.
# npm pack verifies the tarball against the registry integrity hash.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/vendor-leaflet.yml"

permissions:
  contents: write

env:
  LEAFLET_VERSION: "1.9.4"

jobs:
  vendor:
    name: Vendor Leaflet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Leaflet from npm
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          (cd "$workdir" && npm pack "leaflet@${LEAFLET_VERSION}" --silent && tar -xzf "leaflet-${LEAFLET_VERSION}.tgz")
          src="$workdir/package"
          dest="custom_components/ais_tanker/www/leaflet"
          rm -rf "$dest"
          mkdir -p "$dest/images"
          cp "$src/dist/leaflet.js" "$src/dist/leaflet.css" "$dest/"
          cp "$src/dist/images/"*.png "$dest/images/"
          cp "$src/LICENSE" "$dest/LICENSE"
          (cd "$dest" && sha256sum leaflet.js leaflet.css LICENSE images/*.png > SHA256SUMS)
          {
            echo "# Leaflet ${LEAFLET_VERSION}"
            echo
            echo "Unmodified copy of the Leaflet ${LEAFLET_VERSION} distribution files from the npm package"
            echo "https://www.npmjs.com/package/leaflet/v/${LEAFLET_VERSION}"
            echo
            echo "Leaflet is licensed under the BSD 2-Clause License, see LICENSE in this folder."
            echo "Generated by .github/workflows/vendor-leaflet.yml, checksums in SHA256SUMS."
          } > "$dest/README.md"
          ls -la "$dest" "$dest/images"
          cat "$dest/SHA256SUMS"

      - name: Commit vendored files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ais_tanker/www/leaflet
          if git diff --cached --quiet; then
            echo "Leaflet ${LEAFLET_VERSION} already vendored, nothing to commit"
            exit 0
          fi
          git commit -m "Vendor Leaflet ${LEAFLET_VERSION} (unmodified, from npm)"
          git push
